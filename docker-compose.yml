services:
  postgres:
    image: postgres:15-alpine
    container_name: geofen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-geofen_db}
      POSTGRES_USER: ${DB_USERNAME:-geofen_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geofen_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-geofen_user} -d ${DB_NAME:-geofen_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: geofen-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@geofen.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
